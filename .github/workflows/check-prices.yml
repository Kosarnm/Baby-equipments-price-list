name: Check Prisjakt prices

on:
  schedule:
    - cron: '23 5 * * *'     # every day around 06:23 Norwegian time; GitHub delays runs set on the full hour the most
  push:
    paths: ['baby-list.csv', 'track-prices.ps1']  # re-check right after the list or tracker changes
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices
        shell: pwsh
        run: ./track-prices.ps1 -JsonFile docs/data.json -ReportFile report.html -NoOpen

      - name: Save results
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if [ -f price-history.csv ]; then git add price-history.csv; fi
          git diff --cached --quiet || git commit -m "Prices $(date +'%Y-%m-%d %H:%M')"
          # A list change saved from the app can land between pull and push; retry a few times.
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
